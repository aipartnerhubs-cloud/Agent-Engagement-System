<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', -apple-system, system-ui, sans-serif;
  background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 50%, #db2777 100%);
  min-height: 100vh;
  padding: 16px 12px 80px;
  color: #1f2937;
}

/* Header */
.header {
  text-align: center;
  color: white;
  margin-bottom: 16px;
}
.header h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
.header p { font-size: 12px; opacity: 0.9; }

/* Agent Bar */
.agent-bar {
  background: white;
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 16px;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.agent-label {
  font-size: 12px;
  font-weight: 800;
  color: #475569;
  margin-bottom: 8px;
  text-align: center;
}
.agent-input {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #fbbf24;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  outline: none;
  margin-bottom: 6px;
  font-family: inherit;
}
.agent-input:focus { border-color: #f59e0b; }

/* Category Tabs - Horizontal Scroll */
.tabs-wrap {
  max-width: 360px;
  margin: 0 auto 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs-wrap::-webkit-scrollbar { display: none; }

.tabs {
  display: flex;
  gap: 8px;
  padding: 4px 0;
  white-space: nowrap;
  width: max-content;
  margin: 0 auto;
}

.tab {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  color: white;
  border: 2px solid rgba(255,255,255,0.3);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.tab.active {
  background: white;
  color: #7c3aed;
  border-color: white;
}

/* Poster */
.poster {
  max-width: 340px;
  margin: 0 auto;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 25px 70px rgba(0,0,0,0.4);
  background: white;
}

.hero {
  padding: 20px 16px 12px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before, .hero::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
}
.hero::before { top: -50px; right: -50px; width: 140px; height: 140px; }
.hero::after { bottom: -30px; left: -30px; width: 100px; height: 100px; }

.hero-content { position: relative; z-index: 10; }

.badge {
  display: inline-block;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  color: white;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.3);
}

.illustration {
  width: 220px; height: 140px;
  margin: 6px auto;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
}

.headline {
  color: white;
  font-size: 24px;
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: 4px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
.subline {
  color: #fde047;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

/* Hero backgrounds by category */
.hero-car { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); }
.hero-bike { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); }
.hero-commercial { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }
.hero-health { background: linear-gradient(135deg, #ec4899 0%, #9d174d 100%); }
.hero-life { background: linear-gradient(135deg, #10b981 0%, #065f46 100%); }
.hero-term { background: linear-gradient(135deg, #8b5cf6 0%, #5b21b6 100%); }

/* Content */
.content { padding: 16px 16px 14px; background: white; }

.benefits {
  background: #f0fdf4;
  border-left: 4px solid #10b981;
  padding: 12px 14px;
  border-radius: 8px;
  margin-bottom: 10px;
}
.benefit {
  font-size: 14px;
  font-weight: 700;
  color: #064e3b;
  padding: 2px 0;
  display: flex;
  gap: 8px;
}

.cta {
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  color: #1e293b;
  padding: 8px 10px;
  background: #fef3c7;
  border-radius: 8px;
  border: 2px dashed #f59e0b;
  margin-bottom: 10px;
}

.contact-card {
  background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
  color: white;
  padding: 12px 14px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
}
.contact-name {
  font-size: 16px;
  font-weight: 900;
  line-height: 1.1;
}
.contact-mobile {
  font-size: 20px;
  font-weight: 900;
  color: #fde047;
  margin: 3px 0;
  letter-spacing: 0.5px;
}
.contact-brand {
  font-size: 11px;
  font-weight: 700;
  opacity: 0.9;
}
.contact-tagline {
  font-size: 10px;
  font-style: italic;
  opacity: 0.8;
  margin-top: 2px;
}

/* Swipe controls */
.swipe-controls {
  max-width: 340px;
  margin: 14px auto 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}
.swipe-btn {
  background: rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.4);
  color: white;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
}
.swipe-btn:active { transform: scale(0.92); }
.swipe-btn:disabled { opacity: 0.3; }

.indicator {
  font-size: 14px;
  font-weight: 800;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 10px 0;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
}
.dot.active { background: white; width: 24px; border-radius: 4px; }

/* Action Buttons */
.actions {
  max-width: 340px;
  margin: 16px auto 0;
}
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  margin-bottom: 8px;
  font-family: inherit;
  color: white;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.btn:active { transform: scale(0.97); }

.btn-whatsapp {
  background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
  font-size: 17px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 6px 20px rgba(37,211,102,0.5); }
  50% { box-shadow: 0 10px 30px rgba(37,211,102,0.8); }
}
.btn-download { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); }
.btn-copy { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #16a34a;
  color: white;
  padding: 12px 24px;
  border-radius: 999px;
  font-weight: 700;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  z-index: 100;
  display: none;
  font-size: 14px;
}
.toast.show { display: block; }
</style>

let currentIdx = 0;

// ============= INIT =============
function getAgent() {
  return {
    name: document.getElementById('inputName').value.trim() || 'Your Name',
    mobile: document.getElementById('inputMobile').value.trim() || '+91 XXXXXXXXXX'
  };
}

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = posters.map((p, i) => 
    `<button class="tab ${i === currentIdx ? 'active' : ''}" onclick="goTo(${i})">${p.emoji} ${p.category.split(' ')[0]}</button>`
  ).join('');
}

function buildDots() {
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = posters.map((_, i) => 
    `<div class="dot ${i === currentIdx ? 'active' : ''}"></div>`
  ).join('');
}

function renderPoster() {
  const p = posters[currentIdx];
  const agent = getAgent();
  
  const html = `
    <div class="poster" id="posterCanvas">
      <div class="hero ${p.heroClass}">
        <div class="hero-content">
          <div class="badge">${p.emoji} ${p.category}</div>
          <div class="illustration">${svgs[p.key]}</div>
          <div class="headline">${p.headline}</div>
          <div class="subline">${p.subline}</div>
        </div>
      </div>
      <div class="content">
        <div class="benefits">
          ${p.benefits.map(b => `<div class="benefit">✅ <span>${b}</span></div>`).join('')}
        </div>
        <div class="cta">${p.cta}</div>
        <div class="contact-card">
          <div class="contact-name">📞 ${agent.name}</div>
          <div class="contact-mobile">${agent.mobile}</div>
          <div class="contact-brand">🏢 PB Partners</div>
          <div class="contact-tagline">Ek Rishta Bharose Ka</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('posterContainer').innerHTML = html;
  document.getElementById('currentIdx').textContent = currentIdx + 1;
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  document.getElementById('nextBtn').disabled = currentIdx === posters.length - 1;
  buildTabs();
  buildDots();
}

function goTo(idx) {
  currentIdx = idx;
  renderPoster();
}

function prev() { if (currentIdx > 0) { currentIdx--; renderPoster(); } }
function next() { if (currentIdx < posters.length - 1) { currentIdx++; renderPoster(); } }

// ============= ACTIONS =============
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function shareWA() {
  const p = posters[currentIdx];
  const agent = getAgent();
  const text = p.waMessage.replace(/{NAME}/g, agent.name).replace(/{MOBILE}/g, agent.mobile);
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  toast('📲 WhatsApp opening...');
}

function copyText() {
  const p = posters[currentIdx];
  const agent = getAgent();
  const text = p.waMessage.replace(/{NAME}/g, agent.name).replace(/{MOBILE}/g, agent.mobile);
  navigator.clipboard.writeText(text).then(() => toast('📋 Copied!')).catch(() => toast('❌ Copy failed'));
}

async function downloadIt() {
  toast('💾 Banaa raha hai...');
  try {
    const canvas = await html2canvas(document.getElementById('posterCanvas'), {
      scale: 3, backgroundColor: '#ffffff', logging: false
    });
    const link = document.createElement('a');
    const p = posters[currentIdx];
    link.download = `${p.category.replace(/\s/g, '-')}-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    setTimeout(() => toast('✅ Download done!'), 800);
  } catch (e) {
    toast('❌ Download failed');
  }
}

// ============= SWIPE GESTURE =============
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) prev();
    else next();
  }
});

// ============= EVENTS =============
document.getElementById('inputName').addEventListener('input', renderPoster);
document.getElementById('inputMobile').addEventListener('input', renderPoster);

// ============= START =============
renderPoster();
</script>
